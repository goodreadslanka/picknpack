<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lookup">
<meta name="theme-color" content="#d9dee4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bench:  #d9dee4;
    --card:   #ffffff;
    --ink:    #17212e;
    --muted:  #667484;
    --rule:   #ccd4dc;
    --signal: #f5b301;
    --go:     #0f7b4f;
    --stop:   #b02a1e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bench);
    color: var(--ink);
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 520px; margin: 0 auto;
    padding: 0 14px calc(24px + env(safe-area-inset-bottom));
  }

  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 2px 8px;
  }
  .bar h1 { margin: 0; flex: 1; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: -0.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--stop); flex: none; }
  .dot.live { background: var(--go); }
  .gear { background: none; border: 0; padding: 4px 2px; font-size: 18px; color: var(--muted); cursor: pointer; }

  /* ---- always-on camera ---- */
  .camWrap { position: relative; height: 168px; margin-bottom: 12px; border-radius: 4px; overflow: hidden; background: #0b1016; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100% !important; height: 168px !important; object-fit: cover; display: block; }
  #reader img { display: none; }

  .camOff {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; text-align: center; background: #0b1016; color: #cfd6de;
  }
  .camOff.on { display: flex; }
  .camOff p { margin: 0; font-size: 14px; line-height: 1.45; max-width: 36ch; }
  .camOff button {
    background: var(--signal); color: var(--ink); border: 0; border-radius: 4px;
    padding: 12px 22px; font: 600 16px 'Archivo', sans-serif; cursor: pointer;
  }

  .manual { display: flex; gap: 8px; margin-bottom: 12px; }
  #code {
    flex: 1; min-width: 0; height: 46px; padding: 0 14px;
    font: 500 17px 'Archivo', sans-serif; font-variant-numeric: tabular-nums;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--rule); border-radius: 4px;
  }
  #code::placeholder { color: #9aa6b3; font-weight: 400; }
  #code:focus { outline: none; border-color: var(--ink); }

  .msg {
    display: none; margin-bottom: 12px; padding: 13px 16px;
    border-left: 5px solid var(--stop); background: var(--card);
    font-size: 16px; line-height: 1.4;
  }
  .msg.on { display: block; }
  .msg.good { border-left-color: var(--go); }

  .note { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .note:empty { display: none; }

  /* ---- result cards ---- */
  #results > .ticket { margin-bottom: 10px; }
  .ticket { background: var(--card); border-radius: 4px; overflow: hidden; animation: lift .16s ease-out; }
  @keyframes lift { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .ticket { animation: none } }

  .isbn { padding: 8px 18px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; letter-spacing: 0.09em; }

  .title {
    margin: 0; padding: 14px 18px 13px;
    font-size: 24px; font-weight: 700; line-height: 1.16; letter-spacing: -0.015em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  .split { display: flex; border-top: 1px solid var(--rule); }
  .cell { flex: 1; padding: 11px 18px; }
  .cell + .cell { border-left: 1px solid var(--rule); }
  .cell .k { font-size: 13px; color: var(--muted); }
  .cell .v { margin-top: 2px; font-size: 30px; font-weight: 600; line-height: 1.1; word-break: break-word; }

  .price { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 18px; background: var(--signal); }
  .price .k { font-size: 15px; font-weight: 500; }
  .price .v { font-size: 35px; font-weight: 700; letter-spacing: -0.02em; }

  /* ---- setup ---- */
  .setup { display: none; padding: 14px 0; }
  .setup.on { display: block; }
  .setup p { margin: 0 0 18px; font-size: 16px; line-height: 1.5; color: var(--muted); max-width: 60ch; }
  .setup label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
  .setup input {
    width: 100%; height: 50px; margin-bottom: 16px; padding: 0 14px;
    font: 400 16px 'Archivo', sans-serif; color: var(--ink);
    background: var(--card); border: 2px solid var(--rule); border-radius: 4px;
  }
  .setup input:focus { outline: none; border-color: var(--ink); }
  .setup .save { width: 100%; height: 56px; background: var(--ink); color: #fff; border: 0;
                 border-radius: 4px; font: 600 18px 'Archivo', sans-serif; cursor: pointer; }
  .setup .back { display: block; margin: 14px auto 0; background: none; border: 0; color: var(--muted);
                 font: 500 15px 'Archivo', sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="dot" id="dot"></div>
    <h1 id="status">Starting camera…</h1>
    <button class="gear" id="gear" type="button" title="Settings">&#9881;</button>
  </div>

  <div class="setup" id="setup">
    <p>Paste the web app link from Apps Script and the access key you set in the script. They stay on this device only.</p>
    <label for="sUrl">Web app link</label>
    <input id="sUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="https://script.google.com/macros/s/…/exec">
    <label for="sTok">Access key</label>
    <input id="sTok" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="the TOKEN value">
    <button class="save" id="save" type="button">Save and connect</button>
    <button class="back" id="back" type="button">Cancel</button>
  </div>

  <div id="station">
    <div class="camWrap">
      <div id="reader"></div>
      <div class="camOff" id="camOff">
        <p id="camOffText">Tap to switch on the camera.</p>
        <button id="camStart" type="button">Start camera</button>
      </div>
    </div>

    <form class="manual" id="form" autocomplete="off">
      <input id="code" inputmode="numeric" placeholder="…or type the ISBN" aria-label="ISBN">
    </form>

    <div class="msg" id="msg" role="status"></div>
    <p class="note" id="note"></p>
    <div id="results"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };

/* ---------------- settings ---------------- */

var cfg = { url: '', token: '' };
try {
  cfg.url = localStorage.getItem('pp_url') || '';
  cfg.token = localStorage.getItem('pp_token') || '';
} catch (e) {}

function openSetup() {
  $('sUrl').value = cfg.url;
  $('sTok').value = cfg.token;
  $('setup').classList.add('on');
  $('station').style.display = 'none';
  $('back').style.display = cfg.url ? 'block' : 'none';
  stopCam();
}
function closeSetup() {
  $('setup').classList.remove('on');
  $('station').style.display = 'block';
  startCam();
}

$('gear').onclick = openSetup;
$('back').onclick = closeSetup;
$('save').onclick = function () {
  var u = $('sUrl').value.trim(), t = $('sTok').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) {
    return alert('The link should start with https://script.google.com/ and end with /exec');
  }
  if (!t) return alert('Enter the access key.');
  cfg.url = u; cfg.token = t;
  try { localStorage.setItem('pp_url', u); localStorage.setItem('pp_token', t); } catch (e) {}
  closeSetup();
  call({ action: 'ping' }, function (res) { if (!res.ok) say(res.message, false); });
};

/* ---------------- transport (JSONP, no CORS needed) ---------------- */

function call(params, cb) {
  if (!cfg.url) { openSetup(); return; }
  var name = 'pp' + Math.random().toString(36).slice(2);
  var s = document.createElement('script');
  var finished = false;

  function cleanup() {
    clearTimeout(timer);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  var timer = setTimeout(function () {
    if (finished) return;
    finished = true; cleanup();
    cb({ ok: false, message: 'No answer from the script. Check the link and your connection.' });
  }, 20000);

  window[name] = function (res) { finished = true; cleanup(); cb(res); };
  s.onerror = function () {
    if (finished) return;
    finished = true; cleanup();
    cb({ ok: false, message: 'Could not reach the script. Check the link, and that access is set to Anyone.' });
  };

  var q = 'callback=' + name + '&token=' + encodeURIComponent(cfg.token);
  for (var k in params) if (params.hasOwnProperty(k)) {
    q += '&' + k + '=' + encodeURIComponent(params[k]);
  }
  s.src = cfg.url + '?' + q;
  document.head.appendChild(s);
}

/* ---------------- lookup ---------------- */

var busy = false, lastCode = '', lastAt = 0;
var keyboardScanner = window.matchMedia('(pointer: fine)').matches;

$('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = $('code').value.trim();
  $('code').value = '';
  lastCode = '';                 // typing the same ISBN again should still work
  submit(v);
});

/** Called by the camera on every read, so it must shrug off repeats. */
function onScan(text) {
  var code = String(text || '').trim();
  var now = Date.now();
  if (busy) return;
  if (code === lastCode && now - lastAt < 3000) return;   // same book still under the lens
  lastCode = code;
  lastAt = now;
  submit(code);
}

function submit(code) {
  if (!code) return;
  clearScreen();                 // previous book disappears before the new one arrives
  busy = true;
  setStatus('Looking up ' + code + '…', true);
  call({ action: 'lookup', code: code }, function (res) {
    busy = false;
    lastAt = Date.now();
    if (!res.ok) {
      beep(false);
      setStatus('Ready to scan', true);
      return say(res.message, false);
    }
    beep(true);
    render(res.matches);
    setStatus('Ready to scan', true);
  });
}

function render(items) {
  var box = $('results');
  box.innerHTML = '';
  items.forEach(function (item) { box.appendChild(cardFor(item)); });
  $('note').textContent = items.length > 1
    ? items.length + ' rows in the sheet share this ISBN.'
    : '';
}

function cardFor(item) {
  var d = document.createElement('div');
  d.className = 'ticket';
  d.innerHTML =
    '<div class="isbn">' + esc(item.isbn) + '</div>' +
    '<h2 class="title">' + esc(item.title || '(no title in sheet)') + '</h2>' +
    '<div class="split">' +
      '<div class="cell"><div class="k">Qty</div><div class="v">' + esc(item.qty || '–') + '</div></div>' +
      '<div class="cell"><div class="k">Into box</div><div class="v">' + esc(item.intoBox || '–') + '</div></div>' +
    '</div>' +
    '<div class="price"><div class="k">Price</div><div class="v">' + esc(item.price || '–') + '</div></div>';
  return d;
}

function clearScreen() {
  $('msg').className = 'msg';
  $('note').textContent = '';
  $('results').innerHTML = '';
}

/* ---------------- camera: on at all times ---------------- */

var reader = null, camOn = false, starting = false;

$('camStart').onclick = function () { startCam(true); };

function startCam(fromTap) {
  if (camOn || starting) return;
  if (!window.Html5Qrcode) {
    return showCamOff('Scanner library did not load. Check the connection and reload the page.');
  }
  starting = true;

  var fmts = window.Html5QrcodeSupportedFormats ? [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128
  ] : undefined;

  reader = reader || new Html5Qrcode('reader', { verbose: false });

  reader.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: { width: 270, height: 110 }, aspectRatio: 1.6, formatsToSupport: fmts },
    function (text) { onScan(text); },
    function () {}
  ).then(function () {
    starting = false;
    camOn = true;
    $('camOff').classList.remove('on');
    setStatus('Ready to scan', true);
  }).catch(function (err) {
    starting = false;
    var e = String(err);
    if (e.indexOf('NotAllowed') > -1 || e.indexOf('Permission') > -1) {
      showCamOff(fromTap
        ? 'Camera blocked for this site. Tap aA in the address bar, then Website Settings, and allow the camera.'
        : 'Tap to switch on the camera.');
    } else if (e.indexOf('NotFound') > -1) {
      showCamOff('No camera found on this device.');
    } else {
      showCamOff('Camera could not start. ' + e);
    }
  });
}

function showCamOff(text) {
  camOn = false;
  $('camOffText').textContent = text;
  $('camOff').classList.add('on');
  setStatus('Camera off', false);
}

function stopCam() {
  if (!reader || !camOn) return;
  camOn = false;
  reader.stop().catch(function () {});
}

/* Keep it running: iOS suspends the stream when the app goes to the background. */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) stopCam();
  else if (!$('setup').classList.contains('on')) setTimeout(startCam, 300);
});

/* ---------------- plumbing ---------------- */

function setStatus(text, live) {
  $('status').textContent = text;
  $('dot').className = 'dot' + (live ? ' live' : '');
}
function say(text, good) {
  var m = $('msg');
  m.textContent = text;
  m.className = 'msg on' + (good ? ' good' : '');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

var ac = null;
function beep(good) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = good ? 1180 : 240;
    g.gain.value = 0.08;
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + (good ? 0.08 : 0.28));
  } catch (e) {}
}

if (!cfg.url || !cfg.token) openSetup();
else startCam();
if (keyboardScanner) $('code').focus();
</script>
</body>
</html>
