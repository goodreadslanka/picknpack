<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pricing &amp; packing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Packing">
<meta name="theme-color" content="#d9dee4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bench:  #d9dee4;
    --card:   #ffffff;
    --ink:    #17212e;
    --muted:  #667484;
    --rule:   #ccd4dc;
    --signal: #f5b301;
    --go:     #0f7b4f;
    --stop:   #b02a1e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bench);
    color: var(--ink);
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 520px; margin: 0 auto;
    padding: 0 14px calc(40px + env(safe-area-inset-bottom));
  }

  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 2px 12px;
    background: var(--bench);
    border-bottom: 1px solid var(--rule);
  }
  .bar h1 { margin: 0; flex: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .count { font-size: 15px; font-weight: 600; color: var(--muted); }
  .count b { color: var(--ink); font-size: 19px; }
  .gear { background: none; border: 0; padding: 4px 2px; font-size: 18px; color: var(--muted); cursor: pointer; }

  .scan { display: flex; gap: 8px; margin: 14px 0; }
  #code {
    flex: 1; min-width: 0; height: 58px; padding: 0 16px;
    font: 600 21px 'Archivo', sans-serif; font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em; color: var(--ink);
    background: var(--card); border: 2px solid var(--ink); border-radius: 4px;
  }
  #code::placeholder { color: #9aa6b3; font-weight: 400; letter-spacing: 0; }
  #code:focus { outline: 3px solid var(--signal); outline-offset: 1px; }

  .camBtn {
    width: 58px; height: 58px; flex: none;
    background: var(--card); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 4px;
    font-size: 22px; cursor: pointer;
  }
  .camBtn[aria-pressed="true"] { background: var(--ink); color: var(--card); }

  #reader { display: none; margin-bottom: 14px; border-radius: 4px; overflow: hidden; background: #000; }
  #reader.on { display: block; }
  #reader video { display: block; width: 100%; }

  .msg {
    display: none; margin-bottom: 14px; padding: 14px 16px;
    border-left: 5px solid var(--stop); background: var(--card);
    font-size: 16px; line-height: 1.4;
  }
  .msg.on { display: block; }
  .msg.good { border-left-color: var(--go); }

  .ticket { display: none; background: var(--card); border-radius: 4px; overflow: hidden; }
  .ticket.on { display: block; animation: lift .18s ease-out; }
  @keyframes lift { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .ticket.on { animation: none } }

  .isbn { padding: 9px 18px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 500; letter-spacing: 0.09em; }
  .title { margin: 0; padding: 16px 18px 14px; font-size: 25px; font-weight: 700; line-height: 1.18; letter-spacing: -0.015em; }

  .row { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--rule); }
  .row .k { flex: none; width: 88px; font-size: 14px; color: var(--muted); }
  .row .v { font-size: 26px; font-weight: 600; line-height: 1.1; word-break: break-word; }

  .split { display: flex; border-top: 1px solid var(--rule); }
  .split .row { flex: 1; border-top: 0; }
  .split .row + .row { border-left: 1px solid var(--rule); }
  .split .k { width: auto; }
  .split .v { font-size: 30px; }

  .price { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 18px; background: var(--signal); }
  .price .k { font-size: 15px; font-weight: 500; }
  .price .v { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }

  .done { display: block; width: 100%; height: 72px; background: var(--go); color: #fff; border: 0;
          font: 600 22px 'Archivo', sans-serif; cursor: pointer; }
  .done:active { background: #0c6440; }
  .done:disabled { background: #8c96a1; }
  .stamp { padding: 16px 18px; background: #eaf3ee; color: var(--go); font-size: 18px; font-weight: 600; }

  .choices { display: none; }
  .choices.on { display: block; }
  .choice {
    display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--rule); border-left: 5px solid var(--signal);
    border-radius: 4px; cursor: pointer; font: 500 17px 'Archivo', sans-serif; color: var(--ink);
  }
  .choice span { display: block; margin-top: 3px; font-size: 14px; color: var(--muted); }

  .history { display: none; margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .history.on { display: block; }
  .history h2 { margin: 0 0 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .history ul { list-style: none; margin: 0; padding: 0; }
  .history li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 15px; }
  .history .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history button { background: none; border: 0; color: var(--stop); font: 500 15px 'Archivo', sans-serif; cursor: pointer; padding: 0; }

  /* setup */
  .setup { display: none; padding: 20px 0; }
  .setup.on { display: block; }
  .setup p { margin: 0 0 18px; font-size: 16px; line-height: 1.5; color: var(--muted); max-width: 60ch; }
  .setup label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
  .setup input {
    width: 100%; height: 50px; margin-bottom: 16px; padding: 0 14px;
    font: 400 16px 'Archivo', sans-serif; color: var(--ink);
    background: var(--card); border: 2px solid var(--rule); border-radius: 4px;
  }
  .setup input:focus { outline: none; border-color: var(--ink); }
  .setup .save { width: 100%; height: 58px; background: var(--ink); color: #fff; border: 0;
                 border-radius: 4px; font: 600 18px 'Archivo', sans-serif; cursor: pointer; }
  .setup .back { display: block; margin: 14px auto 0; background: none; border: 0; color: var(--muted);
                 font: 500 15px 'Archivo', sans-serif; cursor: pointer; }

  .busy { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <h1>Pricing &amp; packing</h1>
    <div class="count"><b id="left">–</b> left</div>
    <button class="gear" id="gear" type="button" title="Settings">&#9881;</button>
  </div>

  <!-- first-run setup -->
  <div class="setup" id="setup">
    <p>Paste the web app link from Apps Script and the access key you set in the script. They stay on this device only.</p>
    <label for="sUrl">Web app link</label>
    <input id="sUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="https://script.google.com/macros/s/…/exec">
    <label for="sTok">Access key</label>
    <input id="sTok" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="the TOKEN value">
    <button class="save" id="save" type="button">Save and connect</button>
    <button class="back" id="back" type="button">Cancel</button>
  </div>

  <!-- station -->
  <div id="station">
    <form class="scan" id="form" autocomplete="off">
      <input id="code" inputmode="numeric" placeholder="Scan or type ISBN" aria-label="ISBN">
      <button class="camBtn" id="cam" type="button" aria-pressed="false" title="Scan with camera">&#9635;</button>
    </form>

    <div id="reader"></div>
    <div class="msg" id="msg" role="status"></div>
    <div class="choices" id="choices"></div>

    <div class="ticket" id="ticket">
      <div class="isbn" id="tIsbn"></div>
      <h2 class="title" id="tTitle"></h2>
      <div class="row"><div class="k">Pick from</div><div class="v" id="tPick"></div></div>
      <div class="split">
        <div class="row"><div class="k">Qty</div><div class="v" id="tQty"></div></div>
        <div class="row"><div class="k">Into box</div><div class="v" id="tBox"></div></div>
      </div>
      <div class="price"><div class="k">Price</div><div class="v" id="tPrice"></div></div>
      <button class="done" id="doneBtn" type="button">Done</button>
      <div class="stamp" id="stamp" style="display:none"></div>
    </div>

    <div class="history" id="history">
      <h2>Just packed</h2>
      <ul id="histList"></ul>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };

/* ---------------- settings ---------------- */

var cfg = { url: '', token: '' };

try {
  cfg.url = localStorage.getItem('pp_url') || '';
  cfg.token = localStorage.getItem('pp_token') || '';
} catch (e) {}

function openSetup() {
  $('sUrl').value = cfg.url;
  $('sTok').value = cfg.token;
  $('setup').classList.add('on');
  $('station').style.display = 'none';
  $('back').style.display = cfg.url ? 'block' : 'none';
}
function closeSetup() {
  $('setup').classList.remove('on');
  $('station').style.display = 'block';
}

$('gear').onclick = openSetup;
$('back').onclick = closeSetup;
$('save').onclick = function () {
  var u = $('sUrl').value.trim(), t = $('sTok').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) {
    return alert('The link should start with https://script.google.com/ and end with /exec');
  }
  if (!t) return alert('Enter the access key.');
  cfg.url = u; cfg.token = t;
  try { localStorage.setItem('pp_url', u); localStorage.setItem('pp_token', t); } catch (e) {}
  closeSetup();
  refreshStats();
};

/* ---------------- transport (JSONP, no CORS needed) ---------------- */

function call(params, cb) {
  if (!cfg.url) { openSetup(); return; }
  var name = 'pp' + Math.random().toString(36).slice(2);
  var s = document.createElement('script');
  var finished = false;

  function cleanup() {
    clearTimeout(timer);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  var timer = setTimeout(function () {
    if (finished) return;
    finished = true; cleanup();
    cb({ ok: false, message: 'No answer from the script. Check the link and your connection.' });
  }, 20000);

  window[name] = function (res) { finished = true; cleanup(); cb(res); };
  s.onerror = function () {
    if (finished) return;
    finished = true; cleanup();
    cb({ ok: false, message: 'Could not reach the script. Check the link, and that access is set to Anyone.' });
  };

  var q = 'callback=' + name + '&token=' + encodeURIComponent(cfg.token);
  for (var k in params) if (params.hasOwnProperty(k)) {
    q += '&' + k + '=' + encodeURIComponent(params[k]);
  }
  s.src = cfg.url + '?' + q;
  document.head.appendChild(s);
}

/* ---------------- lookup ---------------- */

var current = null, history = [];
var keyboardScanner = window.matchMedia('(pointer: fine)').matches;

$('form').addEventListener('submit', function (e) { e.preventDefault(); submit($('code').value); });

function submit(raw) {
  var code = String(raw || '').trim();
  if (!code) return;
  $('code').value = '';
  hideAll();
  setBusy(true);
  call({ action: 'lookup', code: code }, function (res) {
    setBusy(false);
    if (!res.ok) { beep(false); return say(res.message, false); }
    if (res.matches.length === 1) return show(res.matches[0]);
    beep(true);
    var box = $('choices');
    box.innerHTML = '';
    res.matches.forEach(function (item) {
      var b = document.createElement('button');
      b.className = 'choice';
      b.innerHTML = esc(item.title || '(no title)') +
        '<span>Row ' + item.row + ' &middot; box ' + esc(item.intoBox || '–') +
        ' &middot; qty ' + esc(item.qty || '–') + (item.done ? ' &middot; already done' : '') + '</span>';
      b.onclick = function () { show(item); };
      box.appendChild(b);
    });
    box.classList.add('on');
    say(res.matches.length + ' rows share this ISBN. Pick the line you are packing.', true);
  });
}

function show(item) {
  current = item;
  hideAll();
  $('tIsbn').textContent = item.isbn;
  $('tTitle').textContent = item.title || '(no title in sheet)';
  $('tPick').textContent = item.pickFrom || '–';
  $('tQty').textContent = item.qty || '–';
  $('tBox').textContent = item.intoBox || '–';
  $('tPrice').textContent = item.price || '–';
  $('ticket').classList.add('on');
  setDoneState(item.done, 'Already marked done in the sheet');
  beep(true);
  refocus();
}

function setDoneState(isDone, text) {
  $('doneBtn').style.display = isDone ? 'none' : 'block';
  $('stamp').style.display = isDone ? 'block' : 'none';
  if (isDone) $('stamp').textContent = text;
}

/* ---------------- done ---------------- */

$('doneBtn').addEventListener('click', function () {
  if (!current) return;
  var item = current;
  $('doneBtn').disabled = true;
  $('doneBtn').textContent = 'Saving…';
  call({ action: 'done', row: item.row, isbn: item.isbn }, function (res) {
    $('doneBtn').disabled = false;
    $('doneBtn').textContent = 'Done';
    if (!res.ok) { beep(false); return say(res.message, false); }
    setDoneState(true, res.alreadyDone ? 'Already marked done in the sheet' : 'Marked done');
    if (res.stats) $('left').textContent = res.stats.remaining;
    if (!res.alreadyDone) pushHistory(item);
    beep(true);
    refocus();
  });
});

function pushHistory(item) {
  history = [item].concat(history.filter(function (x) { return x.row !== item.row; })).slice(0, 5);
  drawHistory();
}

function drawHistory() {
  var ul = $('histList');
  ul.innerHTML = '';
  history.forEach(function (h) {
    var li = document.createElement('li');
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = h.title || h.isbn;
    var u = document.createElement('button');
    u.textContent = 'Undo';
    u.onclick = function () {
      call({ action: 'undo', row: h.row }, function (res) {
        if (!res.ok) { beep(false); return say(res.message, false); }
        if (res.stats) $('left').textContent = res.stats.remaining;
        history = history.filter(function (x) { return x.row !== h.row; });
        drawHistory();
        say('Row ' + h.row + ' is open again.', true);
      });
    };
    li.appendChild(t); li.appendChild(u);
    ul.appendChild(li);
  });
  $('history').classList.toggle('on', history.length > 0);
}

/* ---------------- camera ---------------- */

var reader = null, camOn = false;

$('cam').addEventListener('click', function () { camOn ? stopCam() : startCam(); });

function startCam() {
  if (!window.Html5Qrcode) return say('Scanner library did not load. Check your connection and reload.', false);
  var fmts = window.Html5QrcodeSupportedFormats ? [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128
  ] : undefined;

  reader = reader || new Html5Qrcode('reader', { verbose: false });
  $('reader').classList.add('on');

  reader.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: { width: 280, height: 150 }, aspectRatio: 1.4, formatsToSupport: fmts },
    function (text) { stopCam(); submit(text); },
    function () {}
  ).then(function () {
    camOn = true;
    $('cam').setAttribute('aria-pressed', 'true');
  }).catch(function (err) {
    $('reader').classList.remove('on');
    var e = String(err);
    if (e.indexOf('NotAllowed') > -1 || e.indexOf('Permission') > -1) {
      say('Camera permission was refused. Tap aA in the address bar, then Website Settings, and allow the camera.', false);
    } else if (e.indexOf('NotFound') > -1) {
      say('No camera found on this device.', false);
    } else {
      say('Camera could not start: ' + e, false);
    }
  });
}

function stopCam() {
  if (!reader || !camOn) return;
  reader.stop().then(function () {
    camOn = false;
    $('reader').classList.remove('on');
    $('cam').setAttribute('aria-pressed', 'false');
  }).catch(function () {});
}

/* ---------------- plumbing ---------------- */

function say(text, good) {
  var m = $('msg');
  m.textContent = text;
  m.className = 'msg on' + (good ? ' good' : '');
  refocus();
}
function hideAll() {
  $('msg').className = 'msg';
  $('ticket').classList.remove('on');
  $('choices').classList.remove('on');
  current = null;
}
function setBusy(on) { document.body.className = on ? 'busy' : ''; }
function refocus() { if (keyboardScanner) $('code').focus(); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

var ac = null;
function beep(good) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = good ? 1180 : 240;
    g.gain.value = 0.08;
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + (good ? 0.08 : 0.28));
  } catch (e) {}
}

function refreshStats() {
  call({ action: 'stats' }, function (res) {
    if (res.ok && res.stats) $('left').textContent = res.stats.remaining;
    else if (!res.ok) say(res.message, false);
  });
}

if (!cfg.url || !cfg.token) openSetup();
else refreshStats();
refocus();
</script>
</body>
</html>
